<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#101a3a"/>
      <stop offset="1" stop-color="#1b1147"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.8" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="round"><rect width="1280" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <rect width="1280" height="320" fill="url(#glow1)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect width="1280" height="320" fill="url(#glow2)">
      <animate attributeName="opacity" values="1;0.6;1" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- floating code glyphs -->
    <g font-family="Consolas, 'Courier New', monospace" fill="#38bdf8" fill-opacity="0.28" font-size="46" font-weight="700">
      <text x="90" y="90">&lt;/&gt;
        <animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="5s" repeatCount="indefinite"/>
      </text>
      <text x="1090" y="95" fill="#a78bfa">{ }
        <animateTransform attributeName="transform" type="translate" values="0,0;0,12;0,0" dur="6s" repeatCount="indefinite"/>
      </text>
      <text x="1010" y="280" fill="#a78bfa">#include
        <animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="7s" repeatCount="indefinite"/>
      </text>
      <text x="70" y="275">git push
        <animateTransform attributeName="transform" type="translate" values="0,0;0,10;0,0" dur="5.5s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- twinkling dots -->
    <g fill="#ffffff">
      <circle cx="220" cy="60" r="2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="250" r="2"><animate attributeName="opacity" values="0.9;0.1;0.9" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="50" r="2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="1180" cy="190" r="2"><animate attributeName="opacity" values="0.9;0.1;0.9" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="660" cy="285" r="2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- text -->
    <g text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="640" y="118" font-size="20" letter-spacing="8" fill="#94a3b8">ASPIRING</text>
      <text x="640" y="190" font-size="76" font-weight="800" fill="url(#accent)">Jawad Ullah</text>
      <text x="640" y="236" font-size="24" fill="#e2e8f0">Software Engineering Student  •  COMSATS Islamabad</text>
      <rect x="560" y="256" width="160" height="4" rx="2" fill="url(#accent)">
        <animate attributeName="width" values="40;160;40" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="x" values="620;560;620" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="640" y="292" font-size="15" letter-spacing="6" fill="#64748b">LEARN  /  BUILD  /  GROW</text>
    </g>
  </g>
</svg>
